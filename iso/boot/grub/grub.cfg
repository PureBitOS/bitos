# BitOS GRUB menu. No autoboot: the menu waits for a choice (timeout=-1).
# Set e.g. `set timeout=5` here to auto-boot the default entry instead.

set timeout=-1
set timeout_style=menu
set default=0

menuentry "BitOS v0.3" --hotkey=b --id bitos {
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "Reboot" --hotkey=r --id reboot {
    reboot
}

menuentry "Shutdown" --hotkey=s --id shutdown {
    halt
}

menuentry "Reboot to Firmware Setup (UEFI)" --hotkey=f --id fwsetup {
    if [ "$grub_platform" = "efi" ]; then
        fwsetup
    else
        echo "Firmware setup needs UEFI — this machine booted via BIOS."
        sleep 3
    fi
}

# --- PRERELEASE ONLY: delete this entry for stable releases ---
menuentry "BitOS v0.3 (Debug)" --hotkey=d --id bitos-debug {
    echo "DEBUG: GRUB debug output on, now booting BitOS..."
    set debug=all
    multiboot2 /boot/kernel.bin
    boot
}
